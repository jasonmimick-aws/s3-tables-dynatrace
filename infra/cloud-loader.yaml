AWSTemplateFormatVersion: "2010-09-09"
Description: Asynchronous BTS loader and recurring S3 Tables workload for the Dynatrace POC.

Parameters:
  TableBucketArn:
    Type: String
    Default: arn:aws:s3tables:us-east-1:347830095179:bucket/airline-datalake-poc

Resources:
  LoaderSourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLoaderSources
            ExpirationInDays: 30
            Status: Enabled
      Tags:
        - { Key: Owner, Value: mimjasov }
        - { Key: Project, Value: s3tables-dt-poc }

  LoaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: s3tables-dt-codebuild-loader-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: loader-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/s3tables-*:* 
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${LoaderSourceBucket.Arn}/source/*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:s3tables-dynatrace/metadata-ingest-token-*
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: S3Tables/POC
              - Effect: Allow
                Action:
                  - s3tables:GetTableBucket
                  - s3tables:GetTable
                  - s3tables:GetTableData
                  - s3tables:GetTableMetadataLocation
                  - s3tables:ListTables
                  - s3tables:ListNamespaces
                  - s3tables:PutTableData
                  - s3tables:UpdateTableMetadataLocation
                Resource:
                  - !Ref TableBucketArn
                  - !Sub ${TableBucketArn}/*

  LoaderProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: s3tables-bts-loader
      Description: Load a BTS month and generate sustained S3 Tables traffic.
      ServiceRole: !GetAtt LoaderRole.Arn
      TimeoutInMinutes: 90
      ConcurrentBuildLimit: 1
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: AWS_ACCOUNT_ID, Value: "347830095179" }
          - { Name: AWS_REGION, Value: us-east-1 }
          - { Name: BTS_YEAR, Value: "2025" }
          - { Name: BTS_MONTH, Value: "1" }
          - { Name: LOADGEN_MINUTES, Value: "20" }
      Source:
        Type: S3
        Location: !Sub ${LoaderSourceBucket}/source/s3tables-loader.zip
        BuildSpec: buildspec.yml
      Tags:
        - { Key: Owner, Value: mimjasov }
        - { Key: Project, Value: s3tables-dt-poc }

  LiveWorkloadProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: s3tables-live-workload
      Description: Run a 15-minute S3 Tables read/write workload every 30 minutes.
      ServiceRole: !GetAtt LoaderRole.Arn
      TimeoutInMinutes: 30
      ConcurrentBuildLimit: 1
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: AWS_ACCOUNT_ID, Value: "347830095179" }
          - { Name: AWS_REGION, Value: us-east-1 }
          - { Name: LOADGEN_MINUTES, Value: "15" }
      Source:
        Type: S3
        Location: !Sub ${LoaderSourceBucket}/source/s3tables-loader.zip
        BuildSpec: buildspec-live.yml
      Tags:
        - { Key: Owner, Value: mimjasov }
        - { Key: Project, Value: s3tables-dt-poc }

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: s3tables-live-workload-scheduler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-live-workload
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt LiveWorkloadProject.Arn

  LiveWorkloadSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: s3tables-live-workload-every-30m
      Description: Keep S3 Tables request, latency, and transfer metrics flowing into Dynatrace.
      FlexibleTimeWindow: { Mode: "OFF" }
      ScheduleExpression: rate(30 minutes)
      State: ENABLED
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:codebuild:startBuild
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"ProjectName":"${LiveWorkloadProject}"}'

Outputs:
  SourceBucketName: { Value: !Ref LoaderSourceBucket }
  LoaderProjectName: { Value: !Ref LoaderProject }
  LiveWorkloadProjectName: { Value: !Ref LiveWorkloadProject }
  LiveWorkloadScheduleName: { Value: !Ref LiveWorkloadSchedule }
